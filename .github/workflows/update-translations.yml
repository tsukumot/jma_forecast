name: Update area.json and translations

on:
  # 定期実行は GitHub の cron ではなく、Home Assistant から API で起動する
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update data
        env:
          SUMMARY_FILE: ${{ runner.temp }}/summary.md
        run: python tools/update_translations.py

      - name: Commit changes
        env:
          SUMMARY_FILE: ${{ runner.temp }}/summary.md
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "変更なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          {
            echo "Update area.json and translations"
            echo
            if [ -f "$SUMMARY_FILE" ]; then cat "$SUMMARY_FILE"; fi
          } > "$RUNNER_TEMP/message.txt"
          git commit -F "$RUNNER_TEMP/message.txt"
          git push
